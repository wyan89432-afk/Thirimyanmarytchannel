name: YouTube to Telegram

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: youtube-to-telegram
  cancel-in-progress: false

jobs:
  check-and-send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check YouTube and send new videos
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || '@happydayfor' }}
          YOUTUBE_CHANNEL_URL: https://www.youtube.com/@thirimyanmar007/videos
        run: python youtube_to_telegram.py

      - name: Save sent video history
        run: |
          if [[ -n "$(git status --porcelain sent_videos.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add sent_videos.json
            git commit -m "chore: update sent video history"
            git push
          else
            echo "No state changes to commit."
          fi
